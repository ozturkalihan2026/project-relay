services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-project_relay}
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      RELAY_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@db:5432/${POSTGRES_DB:-project_relay}
      RELAY_JWT_SECRET: ${RELAY_JWT_SECRET:-project-relay-local-development-secret-change-before-deployment}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  relay-postgres:
