[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-relay-server"
version = "0.8.15"
description = "Project Relay v0.8.15 progression, rewards and visual atmosphere API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn>=0.51,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["relay_api", "relay_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
